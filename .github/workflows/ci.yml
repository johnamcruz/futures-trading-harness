name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every branch and its history: the platform-name pins are checked against
          # git merge-base HEAD origin/main (tests/plugin/no-platform-specifics.test.js).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run sync:check
      - run: node scripts/strategies.js validate
      # No env files or credential values in the repository.
      - run: npm run check:secrets

  # The goal regression's tier 2 (docs/TRAINING.md, "The goal regression"): the live path with the mock policy, its
  # break self-tests, the broker-fault days, the catch-the-move goldens and tier 1's mutation checks. Too long for every
  # npm run verify, so its own job on every pull request (mark it required in the branch protection with `test`).
  goal-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run goal:full
