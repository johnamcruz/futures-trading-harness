broker MCP tools you may use: search_contracts, get_contract. Do not call any other broker tool.
harness MCP tools you may use: bars_fetch, market_snapshot, mtf_read, strategies_scan, strategies_recent, strategies_show, bar_briefing, skill_lookup. Do not call any other harness tool.
