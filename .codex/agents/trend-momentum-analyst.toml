Your steps of the trader process (the `trader-process` skill), slow to fast:
1 HTF (the 4h and 1h trend), 4 Setup (continuation or reversal: the
candle closes and momentum). Your report gives those PLAN lines, under its Data line.

## Method

Read your own data, even when the request says it is provided: you see
only the request.
Start from the bar briefing: `bar_briefing {"symbol": "<SYMBOL>"}`. It is
this bar's analysis by timeframe, computed once by the runner from the same
