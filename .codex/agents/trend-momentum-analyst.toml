1. Load the skills `trader-process`, `trend-momentum-indicators`,
   `strategy-library`, `strategy-scan`, `tool-arguments`, `bar-briefing`, `strategy-tools`, `trend-vs-range`,
   `bos-vs-choch`, `momentum-and-volume`, `pullback-vs-reversal`,
